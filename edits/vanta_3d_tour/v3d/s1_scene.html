<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#101012;overflow:hidden}#stage{position:relative;width:100vw;height:100vh}#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}</style></head>
<body><div id="stage"><canvas id="gl"></canvas><canvas id="ui"></canvas></div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildVanta, makeRenderer, makeSky, lighting, viewportSize, planTexture, GOLD, GOLD_HI, IVORY, INK } from './vanta3d.js';
const { w: W, h: H } = viewportSize();
const gl = document.getElementById('gl'), ui = document.getElementById('ui'); ui.width = W; ui.height = H; const g2 = ui.getContext('2d');
const renderer = makeRenderer(THREE, gl);
const scene = new THREE.Scene();
const V = buildVanta(THREE, { people: 16, mood: 'day' }); scene.add(V.group);
const cam = new THREE.PerspectiveCamera(36, W / H, 3, 2500);
window.DURATION = 34; 

// ---------- helpers
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const ei = x => Math.pow(cl(x), 3);
const sm = (t, a, b) => eio((t - a) / (b - a));
const win = (t, a, b, c, d) => Math.min(sm(t, a, b), 1 - sm(t, c, d));   // in a..b, out c..d
function spl(keys, t) {   // Hermite spline through [t,v] keys, finite-difference tangents
  const n = keys.length; if (t <= keys[0][0]) return keys[0][1]; if (t >= keys[n - 1][0]) return keys[n - 1][1];
  let i = 0; while (keys[i + 1][0] < t) i++;
  const tg = j => j <= 0 ? (keys[1][1] - keys[0][1]) / (keys[1][0] - keys[0][0]) : j >= n - 1 ? (keys[n - 1][1] - keys[n - 2][1]) / (keys[n - 1][0] - keys[n - 2][0]) : (keys[j + 1][1] - keys[j - 1][1]) / (keys[j + 1][0] - keys[j - 1][0]);
  const [t0, v0] = keys[i], [t1, v1] = keys[i + 1], h = t1 - t0, u = (t - t0) / h, u2 = u * u, u3 = u2 * u;
  return (2 * u3 - 3 * u2 + 1) * v0 + (u3 - 2 * u2 + u) * h * tg(i) + (-2 * u3 + 3 * u2) * v1 + (u3 - u2) * h * tg(i + 1);
}

// ---------- scene geometry
const C = V.dims.buildingCenter;                     // [x,z]
const bp = V.site.boundaryPoints; const SC = new THREE.Vector3(); bp.forEach(p => SC.add(p)); SC.multiplyScalar(1 / bp.length);
// blueprint sheet (pivot at bottom edge, tilts flat)
const tex = await planTexture(THREE, './s1_sheet.png');
const SW = 44, SH = SW * tex.image.height / tex.image.width;
const sheetMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false, side: THREE.DoubleSide, color: 0xffffff });
const sheet = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), sheetMat); sheet.position.y = SH / 2; sheet.renderOrder = 5;
const glowMat = new THREE.MeshBasicMaterial({ color: 0xb08a4e, transparent: true, opacity: .16, depthWrite: false, toneMapped: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
const glow = new THREE.Mesh(new THREE.PlaneGeometry(SW * 1.12, SH * 1.1), glowMat); glow.position.set(0, SH / 2, -.15); glow.renderOrder = 4;
const pivot = new THREE.Group(); pivot.add(sheet, glow); scene.add(pivot);
// site boundary ribbon drawn in gold
const pts = bp.map(p => [p.x, p.z]); pts.push(pts[0]);
const samples = []; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.ceil(L / .8); for (let k = 0; k < n; k++) samples.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n), (b[0] - a[0]) / L, (b[1] - a[1]) / L]); }
function ribbon(w, y) {
  const pos = [], idx = []; samples.forEach((s, i) => { const nx = -s[3], nz = s[2], nxt = samples[(i + 1) % samples.length]; const ex = s[0] + s[2] * .9, ez = s[1] + s[3] * .9;
    const b = pos.length / 3; pos.push(s[0] - nx * w, y, s[1] - nz * w, s[0] + nx * w, y, s[1] + nz * w, ex + nx * w, y, ez + nz * w, ex - nx * w, y, ez - nz * w); idx.push(b, b + 2, b + 1, b, b + 3, b + 2); });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); return g;
}
const NQ = samples.length;
const lineMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, color: 0xD6B26E, toneMapped: false, depthWrite: false, transparent: true });
const line = window.__line = new THREE.Mesh(ribbon(.28, .2), lineMat); line.renderOrder = 6; scene.add(line);
const lineGlowMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, color: 0xB08A4E, toneMapped: false, depthWrite: false, transparent: true, opacity: .3, blending: THREE.AdditiveBlending });
const lineGlow = new THREE.Mesh(ribbon(1.1, .18), lineGlowMat); lineGlow.renderOrder = 6; scene.add(lineGlow);
// gold dust
const NP = 260, dp = new Float32Array(NP * 3), dseed = []; { let s = 7; const r = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; for (let i = 0; i < NP; i++) dseed.push([(r() - .5) * 150, r() * 70, (r() - .5) * 150, .3 + r() * .7, r() * 6.28]); }
const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dmat = new THREE.PointsMaterial({ color: 0xD6B26E, size: 1.1, transparent: true, opacity: .0, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
const dust = new THREE.Points(dgeo, dmat); dust.frustumCulled = false; scene.add(dust);

// floors
const F = V.floors, sign = F[13].group.getObjectByName('sign');
const TB = 9.6, TG = 10.5, TL = k => 11.25 + (k - 1) * .78, TR = 19.95, TS = 20.9;
const floorT = F.map((f, i) => i === 0 ? TB : i === 1 ? TG : i <= 12 ? TL(i - 1) : TR);
const labels = F.map((f, i) => i === 0 ? 'BASEMENT' : i === 1 ? 'GROUND' : i <= 12 ? 'LEVEL ' + String(i - 1).padStart(2, '0') : 'ROOF');
function dropOff(dt, D) {   // metres above final position; fall then tiny settle
  if (dt < 0) return D; const fall = .38; if (dt < fall) return D * (1 - ei(dt / fall) ) ; const v = dt - fall; return .22 * Math.exp(-8 * v) * Math.sin(20 * v);
}
// life
const trees = V.site.trees.group, people = V.site.people.group || V.site.people, cars = V.site.cars && V.site.cars.group, pool = V.site.pool.group;
const grow = (t, a, d = .9) => { const u = cl((t - a) / d); return u <= 0 ? 0 : (1 - Math.pow(1 - u, 3)) * (1 + .08 * Math.sin(u * Math.PI) ); };

// ---------- mood (continuous)
const M = V.materials;
const PAL = { day: { terrain: '#B9C1A4', grass: '#6E9148', paver: '#C2BDB1', paverPale: '#DDD8CB', asphalt: '#47484C', road: '#3B3C40', wall: '#DAD5C9', leaf: '#5C8A3C', leaf2: '#44773A' },
  ink: { terrain: '#101012', grass: '#1C2620', paver: '#2A2A2E', paverPale: '#3A3A3F', asphalt: '#1A1A1D', road: '#17171A', wall: '#3A3A3E', leaf: '#3a5e45', leaf2: '#2a4634' } };
const ca = {}, cb = {}, tmp = new THREE.Color(); for (const k in PAL.day) { ca[k] = new THREE.Color(PAL.ink[k]); cb[k] = new THREE.Color(PAL.day[k]); }
const sky = makeSky(THREE, scene, 'day'); const L = lighting(THREE, scene, 'day', { renderer, materials: V.materials });
const U = sky.material.uniforms, skyInk = { top: new THREE.Color('#0a0a0c'), mid: new THREE.Color('#15151a'), hor: new THREE.Color('#1d1b19') }, skyDay = { top: new THREE.Color('#6f9fd6'), mid: new THREE.Color('#bcd5e6'), hor: new THREE.Color('#eef0ea') };
const fogInk = new THREE.Color(0x121215), fogDay = new THREE.Color('#eef0ea'), bgInk = new THREE.Color(INK);
const lc = (o, a, b, u) => o.color.copy(new THREE.Color(a)).lerp(new THREE.Color(b), u);
function setMix(m) {
  for (const k in ca) if (M[k]) M[k].color.copy(ca[k]).lerp(cb[k], m);
  for (const k of ['top', 'mid', 'hor']) U[k].value.copy(skyInk[k]).lerp(skyDay[k], m);
  scene.fog.color.copy(fogInk).lerp(fogDay, m); scene.fog.near = lerp(220, 300, m); scene.fog.far = lerp(700, 1300, m); scene.background = bgInk.clone().lerp(new THREE.Color('#a9cdee'), m);
  L.key.intensity = lerp(2.4, 2.3, m); lc(L.key, 0xfff2e4, 0xfff5e8, m); L.key.position.set(lerp(65, 70, m), lerp(70, 95, m), lerp(45, 55, m));
  L.fill.intensity = lerp(1.5, .95, m); lc(L.fill, 0x6f8fd0, 0x9cbcf0, m);
  L.hemi.intensity = lerp(.8, .85, m); L.hemi.color.set(0x4a5a78).lerp(new THREE.Color(0xbfd8ff), m); L.hemi.groundColor.set(0x15151a).lerp(new THREE.Color(0x8b8068), m);
  L.rim.intensity = lerp(.7, 0, m);
}

// ---------- camera path
const KA = [[0, -.10], [4, 0], [7, .05], [9.5, 0], [15, -1.6], [22, -3.35], [26, -4.0], [29.5, -4.58], [34, -4.76]];
const KR = [[0, 175], [4, 150], [7, 152], [9.5, 150], [15, 142], [22, 146], [26, 150], [29.5, 150], [34, 138]];
const KY = [[0, 30], [4, 36], [7, 138], [9.5, 120], [15, 92], [22, 70], [26, 52], [29.5, 40], [34, 36]];
const KT = [[0, 0], [9.5, 3], [12, 10], [16, 20], [20, 28], [22, 27], [26, 24], [29.5, 22], [34, 22.5]];
const sc = t => 1 + .3 * sm(t, 4, 7.2);
const tilt = t => -Math.PI / 2 * sm(t, 4, 7.2);

// ---------- 2D overlay
const FONT = "Inter, 'DejaVu Sans', Arial, sans-serif";
function T(str, x, y, px, o = {}) {
  const s = W / 1080; g2.save(); g2.globalAlpha *= (o.a ?? 1); g2.textAlign = o.align || 'center'; g2.textBaseline = 'alphabetic';
  g2.font = `${o.w || 400} ${px * s}px ${FONT}`; g2.letterSpacing = ((o.sp || 0) * s) + 'px'; g2.fillStyle = o.c || IVORY;
  if (o.shadow) { g2.shadowColor = 'rgba(0,0,0,.55)'; g2.shadowBlur = o.shadow * s; }
  let xx = x * s; if (o.align === 'center' || !o.align) xx += (o.sp || 0) * s / 2;   // letterSpacing trailing compensation
  g2.fillText(str, xx, y * s); g2.restore();
}
const vgrad = (y0, y1, a0, a1) => { const s = W / 1080, g = g2.createLinearGradient(0, y0 * s, 0, y1 * s); g.addColorStop(0, `rgba(16,16,18,${a0})`); g.addColorStop(1, `rgba(16,16,18,${a1})`); g2.fillStyle = g; g2.fillRect(0, Math.min(y0, y1) * s, W, Math.abs(y1 - y0) * s); };

window.renderAt = (t) => {
  // mood
  setMix(eio((t - 10.5) / 12));
  // sheet
  pivot.position.set(SC.x, .06, SC.z + 28 * sc(t)); pivot.rotation.x = tilt(t); pivot.scale.setScalar(sc(t));
  const sheetA = 1 - sm(t, 8.2, 10.4); sheetMat.opacity = sheetA * (.92 + .08 * Math.sin(t * 3)); glowMat.opacity = .16 * sheetA; pivot.visible = sheetA > .003;
  // boundary
  const dr = sm(t, 5.4, 8.6), nq = Math.floor(dr * NQ); line.geometry.setDrawRange(0, nq * 6); lineGlow.geometry.setDrawRange(0, nq * 6);
  lineMat.opacity = lerp(1, .75, sm(t, 12, 22)); lineGlowMat.opacity = .3 * (1 - sm(t, 11, 22)); line.visible = lineGlow.visible = nq > 0;
  // ground visibility (basement glimpse)
  V.site.group.visible = t >= TG - .05;
  // floors
  F.forEach((f, i) => {
    const t0 = floorT[i], dt = t - t0, g = f.group;
    if (dt < 0) { g.visible = false; return; } g.visible = true;
    let off = i === 0 ? -dropOff(dt, 7) * .8 : dropOff(dt, i === 1 ? 5 : 8);
    const s = 1 - .05 * (1 - eo(dt / .45)); g.position.set(C[0] * (1 - s), off, C[1] * (1 - s)); g.scale.set(s, 1, s);
  });
  if (sign) { sign.visible = t >= TS; const d2 = t - TS; sign.position.set(0, d2 < 0 ? 8 : dropOff(d2, 9), 0); }
  // life
  const gt = grow(t, 22.3, 1.1); trees.visible = gt > 0; trees.scale.set(1, Math.max(.001, gt), 1);
  const gp = grow(t, 23.4, .8); people.visible = gp > 0; people.scale.set(1, Math.max(.001, gp), 1);
  if (cars) { const gc = grow(t, 24.4, .8); cars.visible = gc > 0; cars.scale.set(1, Math.max(.001, gc), 1); }
  pool.visible = t >= 22.1; V.update(t);
  // dust
  const di = win(t, 0.3, 2, 9, 14) ; dmat.opacity = .85 * di; dust.visible = di > .01;
  if (dust.visible) for (let i = 0; i < NP; i++) { const s = dseed[i]; dp[i * 3] = SC.x + s[0] + Math.sin(t * .3 + s[4]) * 2; dp[i * 3 + 1] = (s[1] + t * s[3] * 1.2) % 70; dp[i * 3 + 2] = SC.z + s[2] + Math.cos(t * .27 + s[4]) * 2; } dgeo.attributes.position.needsUpdate = true;
  // camera
  const a = spl(KA, t), R = spl(KR, t), cy = spl(KY, t), ty = spl(KT, t);
  const flat = sm(t, 4, 7.2), s = sc(t); const hc = SH / 2 * s;
  const shx = SC.x, shy = hc * Math.cos(tilt(t)), shz = SC.z + 28 * s - hc * Math.sin(-tilt(t)) * 1;
  const w = sm(t, 6.8, 9.8), bw = sm(t, 12, 21);
  const fx = lerp(SC.x, C[0] + 3, bw), fz = lerp(SC.z, C[1], bw);
  const tx = lerp(shx, fx, w), tz = lerp(shz, fz, w), tyy = lerp(shy + 4 * (1 - w), ty, w);
  cam.position.set(tx + Math.sin(a) * R, cy, tz + Math.cos(a) * R); cam.lookAt(tx, tyy, tz); cam.updateMatrixWorld();
  renderer.render(scene, cam);

  // ----- overlay
  g2.clearRect(0, 0, W, H); g2.globalAlpha = 1; const S = W / 1080;
  // legibility vignettes
  const vTop = Math.max(win(t, 0, 1, 3.8, 4.6) * .55, win(t, 9, 10.5, 22, 23) * .4); if (vTop > .01) vgrad(0, 620, vTop, 0);
  { const bg = sm(t, 9, 10.5); if (bg > 0) vgrad(1330, 1920, 0, .3 * bg); }
  // beat 1 text
  if (t < 4.8) {
    const full = 'It starts as a drawing.', p = cl((t - .7) / 1.9), n = Math.floor(p * full.length + .001);
    const a1 = win(t, .6, 1.2, 3.7, 4.4), sl = (1 - eo((t - .6) / 1.2)) * 14;
    if (n > 0) { g2.save(); g2.globalAlpha = a1; g2.textAlign = 'left'; g2.font = `300 ${66 * S}px ${FONT}`; g2.letterSpacing = '1px'; const wFull = g2.measureText(full).width; g2.fillStyle = IVORY; g2.shadowColor = 'rgba(0,0,0,.5)'; g2.shadowBlur = 12 * S; g2.fillText(full.slice(0, n), (W - wFull) / 2, (322 + sl) * S);
      if (p < 1) { const cw = g2.measureText(full.slice(0, n)).width; g2.fillStyle = GOLD_HI; g2.fillRect((W - wFull) / 2 + cw + 6 * S, (322 + sl - 50) * S, 3 * S, 62 * S); } g2.restore(); }
    T('APPROVED ARCHITECTURAL DRAWINGS', 540, 384 + (1 - eo((t - 2.3) / 1.2)) * 12, 26, { c: GOLD_HI, sp: 7, w: 500, a: win(t, 2.3, 3.2, 3.7, 4.4) });
  }
  // level counter
  { const idx = F.reduce((m, f, i) => t >= floorT[i] ? i : m, -1); const lab = idx >= 0 ? labels[idx] : null; const ai = win(t, 9.5, 10.1, 21.7, 22.5);
    if (lab && ai > .01) { const dt = t - floorT[idx], pop = 1 + .14 * Math.exp(-dt * 9) * Math.cos(dt * 18), flash = Math.exp(-dt * 5);
      g2.save(); g2.globalAlpha = ai; const cx = 540 * S, cyy = 372 * S; g2.translate(cx, cyy); g2.scale(pop, pop); g2.translate(-cx, -cyy);
      const col = `rgb(${Math.round(250 - flash * 0)},${Math.round(lerp(248, 214, flash))},${Math.round(lerp(243, 160, flash))})`;
      T(lab, 540, 372, lab.length > 6 ? 88 : 96, { w: 300, sp: 14, c: col, shadow: 16 }); g2.restore();
      // thin gold rule that grows with the build
      const prog = cl((idx) / 13); g2.save(); g2.globalAlpha = ai * .9; g2.fillStyle = 'rgba(250,248,243,.18)'; g2.fillRect(270 * S, 420 * S, 540 * S, 3 * S); g2.fillStyle = GOLD_HI; g2.fillRect(270 * S, 420 * S, 540 * S * prog, 3 * S); g2.restore(); } }
  // permanent note
  { const an = sm(t, 9, 10); if (an > 0) { T('3D illustration from the approved drawings.', 60, 1400, 25, { align: 'left', a: .6 * an, sp: .4, shadow: 8 }); T('Not the final appearance.', 60, 1434, 25, { align: 'left', a: .6 * an, sp: .4, shadow: 8 }); } }
  // end title
  { const e = sm(t, 30, 31.6); if (e > 0) { g2.globalAlpha = 1; const s2 = W / 1080; const g = g2.createLinearGradient(0, 380 * s2, 0, 1560 * s2); g.addColorStop(0, 'rgba(16,16,18,0)'); g.addColorStop(.35, `rgba(16,16,18,${.58 * e})`); g.addColorStop(.7, `rgba(16,16,18,${.66 * e})`); g.addColorStop(1, `rgba(16,16,18,${.0})`); g2.fillStyle = g; g2.fillRect(0, 380 * s2, W, 1180 * s2);
      const a = win(t, 30.5, 31.7, 99, 100), sl = (1 - eo((t - 30.5) / 1.4)) * 20;
      T('VANTA HOUSE', 540, 940 + sl, 104, { w: 600, sp: 16, a, shadow: 18 });
      const lw = 150 * eo((t - 31.0) / 1.2); g2.save(); g2.globalAlpha = a; g2.fillStyle = GOLD_HI; g2.fillRect((540 - lw / 2) * s2, (985 + sl) * s2, lw * s2, 3 * s2); g2.restore();
      T('NAGURU, KAMPALA', 540, 1062 + sl * .8, 36, { w: 500, sp: 10, c: GOLD_HI, a: win(t, 31.0, 32.0, 99, 100) });
      T('Blackstone Real Estate', 540, 1130 + sl * .6, 27, { w: 400, sp: 3, c: IVORY, a: .8 * win(t, 31.4, 32.4, 99, 100) }); } }
  return true;
};
window.ready = true;
